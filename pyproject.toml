[project]
name = "tj"
version = "0.1.0"
description = "AI trading journal: MT5 sync, MCP tools for Claude, web UI"
authors = [
    { name = "Syed Muhammad Ali Hassan Gillani", email = "46022930+gillani-hello@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "mcp[cli]>=2.3.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2",
    "tzlocal>=5.4.5",
    "uvicorn[standard]>=0.54.0",
    "watchfiles>=1.3.0",
]

[project.scripts]
tj = "tj.cli:main"

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
